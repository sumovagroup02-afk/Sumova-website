# Litestream: streams the SQLite database to R2 continuously (point-in-time restore, 30 days kept).
# Values come from the container environment (set as Worker secrets/vars, see DEPLOY.md).
dbs:
  - path: ${DATA_DIR}/sumova.db
    replicas:
      - type: s3
        bucket: ${R2_BUCKET}
        path: litestream/sumova.db
        endpoint: ${R2_ENDPOINT}
        region: auto
        force-path-style: true
        access-key-id: ${R2_ACCESS_KEY_ID}
        secret-access-key: ${R2_SECRET_ACCESS_KEY}
        snapshot-interval: 24h
        retention: 720h
        sync-interval: 1s
